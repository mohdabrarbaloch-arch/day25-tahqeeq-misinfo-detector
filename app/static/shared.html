<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A shared Tahqeeq report</title>
<meta name="description" content="A shared misinformation analysis from Tahqeeq." />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">ت</span>
      <span class="brand-text">
        <strong>Tahqeeq</strong>
        <small>تحقیق</small>
      </span>
    </a>
    <nav class="topnav">
      <a class="btn btn-ghost" href="/">Check something yourself</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="check-head">
    <h1>Shared report</h1>
    <p class="lede" id="shared-meta">Loading…</p>
  </div>
  <div id="result"></div>
</main>

<footer class="footer">
  <div class="wrap">
    <p>
      <strong>Tahqeeq</strong> reads style and sourcing, not facts. A high score means
      nothing suspicious was found in the writing — it is not a guarantee that the
      claims are true. Always check the primary source.
    </p>
  </div>
</footer>

<script src="/static/shared.js"></script>
</body>
</html>
